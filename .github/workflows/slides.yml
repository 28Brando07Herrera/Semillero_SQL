# Convierte cada clases/**/slides.md en HTML con Marp y lo publica en GitHub Pages.
# Requisito: Settings -> Pages -> Source: GitHub Actions
name: Publicar diapositivas

on:
  push:
    branches: [main]
    paths:
      - 'clases/**'
      - '.github/workflows/slides.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar HTML de cada clase
        run: |
          mkdir -p site
          for f in clases/*/slides.md; do
            dir=$(basename "$(dirname "$f")")
            echo "Compilando $f -> site/$dir.html"
            npx --yes @marp-team/marp-cli@latest "$f" \
              --html --allow-local-files -o "site/$dir.html"
          done

      - name: Armar índice
        run: |
          {
            echo '<!doctype html><meta charset="utf-8">'
            echo '<title>Curso de SQL - AgroDB</title>'
            echo '<style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem;line-height:1.7}a{color:#1c7293}</style>'
            echo '<h1>Curso de SQL &middot; AgroDB</h1><ul>'
            for f in site/*.html; do
              n=$(basename "$f" .html)
              [ "$n" = "index" ] && continue
              echo "<li><a href=\"$n.html\">$n</a></li>"
            done
            echo '</ul>'
          } > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
